<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Putra Deka Mandiri</title>
    <script>
      // SPA fallback for GitHub Pages: encode the requested path into ?/ and bounce to /pdm-site/.
      // index.html decodes it and hands the correct URL to react-router. Standard technique from rafgraph/spa-github-pages.
      (function () {
        var segmentsToKeep = 1; // "/pdm-site"
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
